name: helmrun-test

services:
  postgres:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE is required}
    container_name: helmrun-postgres-test
    restart: 'no'
    init: true
    environment:
      POSTGRES_USER: ${TEST_DB_USER:?TEST_DB_USER is required}
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:?TEST_DB_PASSWORD is required}
      POSTGRES_DB: ${TEST_DB_NAME:?TEST_DB_NAME is required}
    ports:
      - '127.0.0.1:${TEST_DB_PORT:?TEST_DB_PORT is required}:5432'
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -p 5432 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 30s
    shm_size: 128mb

  redis:
    image: ${TEST_REDIS_IMAGE:?TEST_REDIS_IMAGE is required}
    container_name: helmrun-redis-test
    restart: 'no'
    init: true
    environment:
      REDISCLI_AUTH: ${TEST_REDIS_PASSWORD:?TEST_REDIS_PASSWORD is required}
    command:
      - /bin/sh
      - -ec
      - >-
        exec redis-server --save "" --requirepass "$$REDISCLI_AUTH"
    ports:
      - '127.0.0.1:${TEST_REDIS_PORT:?TEST_REDIS_PORT is required}:6379'
    healthcheck:
      test: [CMD-SHELL, "redis-cli -h 127.0.0.1 -p 6379 ping | grep -q '^PONG$$'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s
