# Repository quality gate (phase 0, workstream P). Deployment CI/CD is phase 7.
name: CI

# Pushes to main, plus pull requests. A push to a PR branch is covered by
# pull_request alone, so it doesn't run twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# On a PR, a newer push cancels the run it supersedes. On main every commit is
# verified, so runs there queue instead of cancelling each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # safe.directory: git refuses a repo owned by another user (the runner).
      - name: Scan every commit for secrets
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/repo"
          -e GIT_CONFIG_COUNT=1
          -e GIT_CONFIG_KEY_0=safe.directory
          -e GIT_CONFIG_VALUE_0=/repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --no-banner

  quality:
    name: Format, lint, typecheck, unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Versions match package.json (packageManager, engines) and .nvmrc.
      - name: Install pinned pnpm and Node.js
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          version: 11.27.1
          runtime: node@24.21.0
          cache: true
          install: false

      - name: Verify toolchain versions
        shell: bash
        run: |
          test "$(node --version)" = "v$(cat .nvmrc)"
          test "$(pnpm --version)" = "11.27.1"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      # Test-only values (decision 008), same file developers copy locally.
      - name: Create test environment file
        run: cp .env.test.example .env.test

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # The spec is generated from the Zod schemas (decision 014); a stale
      # committed copy means a contract change skipped review.
      - name: Check OpenAPI spec is up to date
        run: pnpm openapi:check

      - name: Run unit tests
        run: pnpm test:unit

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

  integration:
    name: Integration tests and build
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned pnpm and Node.js
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          version: 11.27.1
          runtime: node@24.21.0
          cache: true
          install: false

      - name: Verify toolchain versions
        shell: bash
        run: |
          test "$(node --version)" = "v$(cat .nvmrc)"
          test "$(pnpm --version)" = "11.27.1"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Create test environment file
        run: cp .env.test.example .env.test

      # The same test stack developers run locally (Postgres + Valkey, empty on
      # every start). --wait blocks until both healthchecks pass.
      - name: Start test stack
        id: test-stack
        run: docker compose -f docker-compose.test.yml --env-file .env.test up -d --wait

      - name: Run test migrations
        run: pnpm db:migrate:test

      - name: Run integration tests
        run: pnpm test:integration

      - name: Build
        run: pnpm build

      - name: Smoke-test built apps
        shell: bash
        run: |
          set -euo pipefail
          set -a; source .env.test; set +a
          export NODE_ENV=production LOG_LEVEL=info PORT=8099 SHUTDOWN_TIMEOUT_MS=20000
          export DATABASE_URL="$TEST_DATABASE_URL" REDIS_URL="$TEST_REDIS_URL"
          for app in api scheduler worker; do
            node "apps/$app/dist/main" > "/tmp/smoke-$app.log" 2>&1 &
            pid=$!
            sleep 3
            kill -0 "$pid" || { cat "/tmp/smoke-$app.log"; exit 1; }
            if [ "$app" = api ]; then curl -fsS "http://127.0.0.1:$PORT/health/live"; echo; fi
            kill -TERM "$pid"
            wait "$pid" || { cat "/tmp/smoke-$app.log"; exit 1; }
          done

      # Only if the stack step ran: an earlier failure (install, checkout) leaves
      # no stack and no .env.test, and this step would fail too.
      - name: Show test stack logs on failure
        if: failure() && steps.test-stack.outcome != 'skipped'
        run: docker compose -f docker-compose.test.yml --env-file .env.test logs --no-color
